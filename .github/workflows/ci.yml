name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build shared package
      run: npm run build --workspace=packages/shared

    - name: Type check microservices
      run: |
        npm run build --workspace=services/api-gateway
        npm run build --workspace=services/auth-service
        npm run build --workspace=services/repository-service
        npm run build --workspace=services/review-service
        npm run build --workspace=services/ai-service

    - name: Build Next.js Client
      run: npm run build --workspace=client
      env:
        NEXT_TELEMETRY_DISABLED: 1

    - name: Run Tests
      run: npm run test
