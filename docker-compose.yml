
services:
  # ============================================
  # Infrastructure
  # ============================================
  postgres:
    image: postgres:15
    container_name: aicr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicr_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-aicr_db}
    # SECURITY: Postgres port is NOT published to the host.
    # Services connect via Docker's internal DNS (postgres:5432).
    # To connect from your host machine for dev/debugging, use:
    #   docker compose exec postgres psql -U aicr_user -d aicr_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicr_user} -d ${POSTGRES_DB:-aicr_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aicr-redis
    restart: unless-stopped
    # SECURITY: Redis port is NOT published to the host.
    # Services connect via Docker's internal DNS (redis:6379).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ============================================
  # Services
  # SECURITY: Only api-gateway and client are reachable from outside Docker.
  # All other services communicate via Docker's internal network only.
  # No other service publishes ports to the host.
  # ============================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: aicr-gateway
    restart: unless-stopped
    ports:
      # The ONLY publicly-facing entrypoint for all API traffic.
      - "${API_GATEWAY_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - REPO_SERVICE_URL=http://repository-service:3002
      - REVIEW_SERVICE_URL=http://review-service:3003
      - AI_SERVICE_URL=http://ai-service:3004
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: aicr-auth
    restart: unless-stopped
    # SECURITY: No ports published. Reachable only via api-gateway or other
    # internal services on the Docker network.
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=auth
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  repository-service:
    build:
      context: .
      dockerfile: services/repository-service/Dockerfile
    container_name: aicr-repo
    restart: unless-stopped
    # SECURITY: No ports published. Reachable only via api-gateway.
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=repositories
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - REVIEW_SERVICE_URL=http://review-service:3003
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  review-service:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    container_name: aicr-review
    restart: unless-stopped
    # SECURITY: No ports published. Reachable only via api-gateway.
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=reviews
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: aicr-ai
    restart: unless-stopped
    # SECURITY: No ports published. Jobs arrive via Redis queue only.
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - AI_MOCK_MODE=${AI_MOCK_MODE:-false}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: aicr-client
    restart: unless-stopped
    ports:
      # The ONLY publicly-facing entrypoint for the frontend.
      - "${FRONTEND_PORT:-3010}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
